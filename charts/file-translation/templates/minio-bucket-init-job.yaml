{{- if .Values.minio.bucketInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "file-translation.fullname" . }}-minio-init
  labels:
    {{- include "file-translation.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  {{- if .Values.minio.bucketInit.hook }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  backoffLimit: {{ .Values.minio.bucketInit.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "file-translation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio-init
          image: {{ include "file-translation.jobServiceImage" . }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.jobService.image.pullPolicy }}
          command: ["python", "/scripts/init_bucket.py"]
          envFrom:
            - configMapRef:
                name: {{ include "file-translation.configName" . }}
            - secretRef:
                name: {{ include "file-translation.secretName" . }}
          env:
            - name: MINIO_INIT_TIMEOUT_SECONDS
              value: "180"
          volumeMounts:
            - name: minio-init-script
              mountPath: /scripts
      volumes:
        - name: minio-init-script
          configMap:
            name: {{ include "file-translation.fullname" . }}-minio-init
            defaultMode: 0755
{{- end }}
