{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "file-translation.secretName" .) }}
{{- $rabbitUser := default "file_translation" .Values.secrets.rabbitmq.username }}
{{- $rabbitPassword := default (randAlphaNum 32) .Values.secrets.rabbitmq.password }}
{{- $minioAccessKey := default "file_translation" .Values.secrets.minio.accessKey }}
{{- $minioSecretKey := default (randAlphaNum 32) .Values.secrets.minio.secretKey }}
{{- $postgresUser := default "file_translation" .Values.secrets.postgres.username }}
{{- $postgresPassword := default (randAlphaNum 32) .Values.secrets.postgres.password }}
{{- $translationToken := default "" .Values.secrets.translation.apiToken }}
{{- $emailToken := default "" .Values.secrets.email.apiToken }}
{{- $emailUsername := default "" .Values.secrets.email.apiUsername }}
{{- $emailPassword := default "" .Values.secrets.email.apiPassword }}
{{- if $existing }}
{{- if hasKey $existing.data "RABBITMQ_USERNAME" }}{{- $rabbitUser = (index $existing.data "RABBITMQ_USERNAME" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "RABBITMQ_PASSWORD" }}{{- $rabbitPassword = (index $existing.data "RABBITMQ_PASSWORD" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "MINIO_ACCESS_KEY" }}{{- $minioAccessKey = (index $existing.data "MINIO_ACCESS_KEY" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "MINIO_SECRET_KEY" }}{{- $minioSecretKey = (index $existing.data "MINIO_SECRET_KEY" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "POSTGRES_USER" }}{{- $postgresUser = (index $existing.data "POSTGRES_USER" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "POSTGRES_PASSWORD" }}{{- $postgresPassword = (index $existing.data "POSTGRES_PASSWORD" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "TRANSLATION_API_TOKEN" }}{{- $translationToken = (index $existing.data "TRANSLATION_API_TOKEN" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "EMAIL_API_TOKEN" }}{{- $emailToken = (index $existing.data "EMAIL_API_TOKEN" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "EMAIL_API_USERNAME" }}{{- $emailUsername = (index $existing.data "EMAIL_API_USERNAME" | b64dec) }}{{- end }}
{{- if hasKey $existing.data "EMAIL_API_PASSWORD" }}{{- $emailPassword = (index $existing.data "EMAIL_API_PASSWORD" | b64dec) }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "file-translation.secretName" . }}
  labels:
    {{- include "file-translation.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_USERNAME: {{ $rabbitUser | quote }}
  RABBITMQ_PASSWORD: {{ $rabbitPassword | quote }}
  MINIO_ACCESS_KEY: {{ $minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ $minioSecretKey | quote }}
  POSTGRES_USER: {{ $postgresUser | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  TRANSLATION_API_TOKEN: {{ $translationToken | quote }}
  EMAIL_API_TOKEN: {{ $emailToken | quote }}
  EMAIL_API_USERNAME: {{ $emailUsername | quote }}
  EMAIL_API_PASSWORD: {{ $emailPassword | quote }}
{{- end }}
