{{- if .Values.jobService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "file-translation.jobServiceName" . }}
  labels:
    {{- include "file-translation.labels" . | nindent 4 }}
    app.kubernetes.io/component: job-service
spec:
  type: {{ .Values.jobService.service.type }}
  selector:
    {{- include "file-translation.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: job-service
  ports:
    - name: http
      port: {{ .Values.jobService.service.port }}
      targetPort: http
      {{- if and (eq .Values.jobService.service.type "NodePort") .Values.jobService.service.nodePort }}
      nodePort: {{ .Values.jobService.service.nodePort }}
      {{- end }}
{{- end }}
